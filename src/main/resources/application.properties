spring.application.name=AiDemo
# 【必须背】MySQL 8.0 的驱动类名
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 【复制改库名】注意最后是 memo_db，对应你建的库
spring.datasource.url=jdbc:mysql://localhost:3306/memo_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false

# 【必须记】你的数据库账号
spring.datasource.username=root

# 【必须记】你的数据库密码（换成你自己的）
